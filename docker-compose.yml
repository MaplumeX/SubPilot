# Local: cp .env.example .env  # set SECRET_KEY
#        docker compose up --build
# Published: SUBPILOT_VERSION=1.0.0 docker compose up -d
services:
  app:
    image: ghcr.io/maplumex/subpilot:${SUBPILOT_VERSION:-latest}
    build: .
    ports:
      - "7743:80"
    volumes:
      - subpilot-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:///./data/subpilot.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:7743}
    restart: unless-stopped

volumes:
  subpilot-data:
