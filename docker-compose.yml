services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - subpilot-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:///./data/subpilot.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  subpilot-data:
